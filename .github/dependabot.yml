# Dependabot configuration
# Ecosystem updates will activate once dependency manifests exist in the repository.
# See: https://docs.github.com/en/code-security/dependabot

version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"

  # Uncomment when Python dependencies are introduced (e.g. apps/api, packages/sdk-python)
