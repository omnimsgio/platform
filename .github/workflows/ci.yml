# API-phase CI — lint, migrations, Postgres/Redis integration tests, OpenAPI.
# Does not depend on local Traefik / shared PostGIS stacks.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    name: Ruff + pytest + OpenAPI
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: omnimsgio
          POSTGRES_PASSWORD: omnimsgio
          POSTGRES_DB: omnimsgio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U omnimsgio -d omnimsgio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://omnimsgio:omnimsgio@localhost:5432/omnimsgio
      REDIS_URL: redis://localhost:6379/3
      REDIS_KEY_PREFIX: "omnimsgio:"
      RATE_LIMIT_PER_MINUTE: "60"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package with dev extras
        run: pip install -e ".[dev]"

      - name: Ruff
        run: ruff check apps packages tests

      - name: WhatsApp lifecycle SSOT
        run: ./scripts/check-whatsapp-lifecycle-ssot.sh

      - name: OpenAPI lint
        run: ./scripts/check-openapi-lint.sh

      - name: OpenAPI path/method parity
        run: ./scripts/check-openapi-parity.sh

      - name: Apply migrations
        run: omnimsg-migrate upgrade head

      - name: Inbound no-referral quality gate
        run: >-
          pytest -q
          tests/test_conversation_referral.py::test_inbound_without_referral_preserves_pre_slice_behavior

      - name: Provisioning lifecycle golden path
        run: >-
          pytest -q
          tests/test_provisioning_e2e.py::test_golden_path_not_connected_to_ready_retry_ready

      - name: Pytest
        run: pytest -q

      - name: OpenAPI contract present
        run: test -f packages/contracts/openapi/openapi.yaml

      - name: OpenAPI runtime smoke
        run: ./scripts/smoke-openapi-runtime.sh

  web-build:
    name: Next.js apps/web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build
