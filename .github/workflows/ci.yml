# Foundation CI — lint, smoke tests, contract presence.
# Does not depend on local Traefik / PostGIS / Redis.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    name: Ruff + pytest + OpenAPI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package with dev extras
        run: pip install -e ".[dev]"

      - name: Ruff
        run: ruff check apps packages tests

      - name: Pytest smoke
        run: pytest -q

      - name: OpenAPI contract present
        run: test -f packages/contracts/openapi/openapi.yaml
