[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omnimsgio"
version = "0.1.0"
description = "OmniMsg — API-first omnichannel messaging (omnimsg.io)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "FinestAR", email = "hello@finestar.hr" }]
dependencies = [
  "alembic>=1.14.0",
  "fastapi>=0.115.0",
  "httpx>=0.28.0",
  "psycopg[binary]>=3.2.0",
  "pydantic-settings>=2.6.0",
  "PyYAML>=6.0.0",
  "redis>=5.2.0",
  "sentry-sdk>=2.0.0",
  "sqlalchemy>=2.0.36",
  "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
dev = [
  "openapi-spec-validator>=0.7.0",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.8.0",
]

[project.scripts]
omnimsg-gateway = "omnimsg_gateway.main:run"
omnimsg-api = "omnimsg_api.main:run"
omnimsg-worker = "omnimsg_worker.main:run"
omnimsg-migrate = "omnimsg_common.db.migrate:main"

[tool.setuptools.packages.find]
where = [
  "packages/common",
  "packages/providers",
  "apps/gateway",
  "apps/api",
  "apps/worker",
]
include = [
  "omnimsg_common*",
  "omnimsg_providers*",
  "whatsapp*",
  "omnimsg_gateway*",
  "omnimsg_api*",
  "omnimsg_worker*",
]

[tool.setuptools.package-data]
omnimsg_common = [
  "db/migrations/alembic.ini",
  "db/migrations/script.py.mako",
  "db/migrations/versions/*.py",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [
  "packages/common",
  "packages/providers",
  "apps/gateway",
  "apps/api",
  "apps/worker",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["apps", "packages", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
